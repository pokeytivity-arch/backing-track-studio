<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Visitors · HearandPlay</title>
<script src="brand.js?v=1"></script>
<style>
:root{--bg:#0a0e18;--card:#121828;--card2:#182036;--line:#26304a;--ink:#eef2fa;--mut:#93a0bd;--hi:#ffd43b;--hi2:#ff9f43;--cy:#4fc6e0;--pk:#ec6ce0;--ok:#7bd88f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#1a2550 0,transparent 60%),radial-gradient(900px 500px at 110% 0,#3a1846 0,transparent 55%),var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.w{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
header h1{font:800 26px/1.1 system-ui,sans-serif;margin:0;flex:1;letter-spacing:-.01em}
header h1 small{display:block;font:600 13px system-ui;color:var(--mut);letter-spacing:0;margin-top:4px}
a.bk{color:var(--ink);text-decoration:none;font:700 14px system-ui;border:1.5px solid var(--line);padding:8px 14px;border-radius:999px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;border:1.5px solid var(--line);background:#0d1322}
.seg button{border:0;background:transparent;color:var(--ink);font:700 13px system-ui;padding:7px 12px;border-radius:999px;cursor:pointer;opacity:.8}
.seg button[aria-pressed=true]{background:var(--hi);color:#151b28;opacity:1}
.btn{border:1.5px solid var(--line);background:transparent;color:var(--ink);font:700 13px system-ui;padding:8px 14px;border-radius:999px;cursor:pointer}
.btn.pri{background:var(--hi);color:#151b28;border-color:transparent}
.chk{display:inline-flex;gap:6px;align-items:center;font:600 13px system-ui;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.kpi{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi b{display:block;font:800 26px/1.1 system-ui;font-variant-numeric:tabular-nums}
.kpi span{font:700 12px system-ui;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.card h2{margin:0 0 10px;font:800 13px system-ui;text-transform:uppercase;letter-spacing:.1em;color:var(--hi)}
.full{grid-column:1/-1}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:5px 0;border-top:1px solid rgba(255,255,255,.05)}
.row:first-of-type{border-top:0}
.row .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .v{font:700 13px system-ui;color:var(--mut);font-variant-numeric:tabular-nums;text-align:right}
.bar{grid-column:1/-1;height:5px;border-radius:3px;background:#1c2540;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--pk))}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:700 12px system-ui;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.05);font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right}
.days{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.days div{flex:1;min-width:3px;background:linear-gradient(180deg,var(--hi),var(--hi2));border-radius:4px 4px 1px 1px;position:relative}
.days div:hover:after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#000;padding:3px 7px;border-radius:6px;font:600 11px system-ui;margin-bottom:4px;z-index:2}
.dl{display:flex;justify-content:space-between;font:600 11px system-ui;color:var(--mut);margin-top:4px}
.vis{border-top:1px solid rgba(255,255,255,.06);padding:10px 0}
.vis:first-of-type{border-top:0}
.vh{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.vh .when{font:800 14px system-ui}
.vh .pl{font-weight:700}
.vh .m{color:var(--mut);font-size:13px}
.vh .t{margin-left:auto;font:800 14px system-ui;color:var(--hi);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;background:#1a2340;border:1px solid #2a3558;font:600 12.5px system-ui}
.chip em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font:700 11px system-ui;background:#23305a;color:#cdd7f2}
.tag.back{background:rgba(123,216,143,.16);color:var(--ok)}
.tag.u{background:rgba(255,212,59,.16);color:var(--hi)}
.box{max-width:520px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center}
.box h2{margin:0 0 8px;font:800 22px system-ui}
.box p{color:var(--mut)}
.box input{width:100%;margin:10px 0;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#0b1120;color:var(--ink);font:700 16px ui-monospace,monospace;text-align:center;letter-spacing:.06em}
.err{color:#ff8a8a;font-weight:700;min-height:1.2em}
.empty{color:var(--mut);padding:8px 0}
.more{margin-top:10px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.kpis .kpi:last-child{grid-column:1/-1}.grid{grid-template-columns:1fr}.hide-s{display:none}}
</style>
</head>
<body>
<div class="w" id="app"><p class="empty">Loading…</p></div>
<script>
(function(){
const $=s=>document.querySelector(s), app=$('#app');
const tok=()=>{ try{ return localStorage.getItem('ps-tok')||''; }catch(_){ return ''; } };
async function call(body){ const r=await fetch('/api/visit',{method:'POST',headers:{'content-type':'text/plain',authorization:'Bearer '+tok()},body:JSON.stringify(body)}); let j={}; try{ j=await r.json(); }catch(_){} j._s=r.status; return j; }
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CN=null; try{ CN=new Intl.DisplayNames(['en'],{type:'region'}); }catch(_){}
const cname=c=>{ if(!c||c==='XX'||c==='T1') return 'Unknown'; try{ return CN?CN.of(c):c; }catch(_){ return c; } };
const flag=c=>(!c||!/^[A-Z]{2}$/.test(c)||c==='XX'||c==='T1')?'🌐':String.fromCodePoint(...[...c].map(x=>0x1F1E6+x.charCodeAt(0)-65));
const dur=s=>{ s=Math.round(+s||0); if(s<60) return s+'s'; const m=Math.floor(s/60); if(m<60) return m+'m '+String(s%60).padStart(2,'0')+'s'; const h=Math.floor(m/60); return h+'h '+String(m%60).padStart(2,'0')+'m'; };
const when=t=>{ const d=new Date(t), n=new Date(), y=new Date(n-86400000); const tm=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}); if(d.toDateString()===n.toDateString()) return 'Today '+tm; if(d.toDateString()===y.toDateString()) return 'Yesterday '+tm; return d.toLocaleDateString([],{day:'numeric',month:'short'})+' '+tm; };
let ST={days:7,host:'',shown:40}; try{ Object.assign(ST,JSON.parse(localStorage.getItem('ps-vis-st')||'{}')); ST.shown=40; }catch(_){}
const keep=()=>{ try{ localStorage.setItem('ps-vis-st',JSON.stringify({days:ST.days,host:ST.host})); }catch(_){} };

function signedOut(){ app.innerHTML='<div class="box"><h2>📊 Visitors</h2><p>This page is only for the owner’s account. Sign in to your account in the suite first, then come back here.</p><p><a class="btn pri" href="/" style="text-decoration:none;display:inline-block">Open the suite and sign in</a></p></div>'; }
function claim(){ app.innerHTML='<div class="box"><h2>📊 Link your account</h2><p>The Visitors board opens only for the owner’s account. Enter your owner key once to link the account you are signed in with. After that, just being signed in is enough.</p><input id="k" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxxx-xxxxx-xxxxx-xxxxx"><div class="err" id="er"></div><button class="btn pri" id="go">Link my account</button> <a class="btn" href="/" style="text-decoration:none;display:inline-block">Back to the suite</a></div>';
  const go=async()=>{ $('#er').textContent=''; const j=await call({a:'claim',key:$('#k').value}); if(j.owner) load(); else $('#er').textContent=j.error==='key'?'That key is not right.':j.error==='slow'?'Too many tries. Wait a few minutes.':'Could not link the account. Try again.'; };
  $('#go').onclick=go; $('#k').onkeydown=e=>{ if(e.key==='Enter') go(); }; $('#k').focus(); }

function list(rows,label,val,max){ if(!rows.length) return '<p class="empty">Nothing yet.</p>'; const top=Math.max(1,...rows.map(r=>+r.n||0)); return rows.slice(0,max||12).map(r=>'<div class="row"><span class="k">'+label(r)+'</span><span class="v">'+val(r)+'</span><div class="bar"><i style="width:'+Math.round((+r.n||0)/top*100)+'%"></i></div></div>').join(''); }

function board(d){
  try{ if(localStorage.getItem('ps-vis-me')==null) localStorage.setItem('ps-vis-me','1'); }catch(_){}
  const T=d.totals||{}, n=+T.n||0, people=+T.people||0, back=+T.back||0;
  const byV={}; (d.views||[]).forEach(v=>{ (byV[v.visit]=byV[v.visit]||[]).push(v); });
  const dayN=d.byDay||[]; const tz=-new Date().getTimezoneOffset()*60000; const firstDay=Math.floor((d.now+tz)/86400000)-d.days+1; const map={}; dayN.forEach(r=>map[r.d]=r);
  const span=Math.min(d.days,90), cols=[]; for(let i=Math.max(0,d.days-span);i<d.days;i++){ const k=firstDay+i; cols.push({k,n:(map[k]||{}).n||0,p:(map[k]||{}).p||0}); }
  const maxD=Math.max(1,...cols.map(c=>c.n)); const dname=k=>new Date(k*86400000-tz+12*3600000).toLocaleDateString([],{day:'numeric',month:'short'});
  const hosts=Object.fromEntries((d.hosts||[]).map(h=>[h.k,h.n]));
  app.innerHTML='<header><h1>📊 Visitors<small>Who visited HearandPlay, where from, and how long they stayed in each space. Times are in your time zone.</small></h1><a class="bk" href="/">← Back to the suite</a></header>'
   +'<div class="ctl"><span class="seg" id="rg">'+[[1,'24 hours'],[7,'7 days'],[30,'30 days'],[90,'90 days'],[365,'Year']].map(([v,t])=>'<button data-v="'+v+'" aria-pressed="'+(ST.days===v)+'">'+t+'</button>').join('')+'</span>'
   +'<span class="seg" id="hs">'+[['','Both sites'],['hearandplay.app','hearandplay.app'],['app.pokeytivity.com','app.pokeytivity.com']].map(([v,t])=>'<button data-v="'+v+'" aria-pressed="'+(ST.host===v)+'">'+t+'</button>').join('')+'</span>'
   +'<button class="btn" id="rf">↻ Refresh</button><label class="chk"><input type="checkbox" id="me"> Don’t count my own visits on this device</label></div>'
   +'<div class="kpis"><div class="kpi"><b>'+n+'</b><span>Visits</span></div><div class="kpi"><b>'+people+'</b><span>Visitors</span></div><div class="kpi"><b>'+(n?Math.round(back/n*100):0)+'%</b><span>Came back</span></div><div class="kpi"><b>'+dur(T.avg)+'</b><span>Average visit</span></div><div class="kpi"><b>'+dur(T.total)+'</b><span>Total time</span></div></div>'
   +'<div class="grid">'
   +'<div class="card full"><h2>Visits per day</h2><div class="days">'+cols.map(c=>'<div style="height:'+Math.max(c.n?6:1,Math.round(c.n/maxD*100))+'%;'+(c.n?'':'opacity:.25')+'" data-t="'+dname(c.k)+': '+c.n+' visit'+(c.n===1?'':'s')+', '+c.p+' visitor'+(c.p===1?'':'s')+'"></div>').join('')+'</div><div class="dl"><span>'+dname(cols[0].k)+'</span><span>'+dname(cols[cols.length-1].k)+'</span></div>'+(ST.host?'':'<p class="empty" style="margin:8px 0 0">hearandplay.app: '+(hosts['hearandplay.app']||0)+' · app.pokeytivity.com: '+(hosts['app.pokeytivity.com']||0)+'</p>')+'</div>'
   +'<div class="card full"><h2>Spaces: where they spent their time</h2>'+((d.spaces||[]).length?'<table><thead><tr><th>Space</th><th class="n">Visits</th><th class="n hide-s">Times opened</th><th class="n">Total time</th><th class="n">Average per visit</th></tr></thead><tbody>'+(d.spaces||[]).map(s=>'<tr><td>'+esc(s.k)+'</td><td class="n">'+s.v+'</td><td class="n hide-s">'+s.n+'</td><td class="n">'+dur(s.t)+'</td><td class="n">'+dur((+s.t||0)/Math.max(1,+s.v||1))+'</td></tr>').join('')+'</tbody></table>':'<p class="empty">Nothing yet.</p>')+'</div>'
   +'<div class="card"><h2>Countries</h2>'+list(d.countries||[],r=>flag(r.k)+' '+esc(cname(r.k)),r=>r.n+' · '+dur(r.t))+'</div>'
   +'<div class="card"><h2>Cities</h2>'+list(d.cities||[],r=>flag(r.c)+' '+esc(r.k),r=>r.n)+'</div>'
   +'<div class="card"><h2>Came from</h2>'+list(d.refs||[],r=>esc(r.k||'Direct'),r=>r.n)+'</div>'
   +'<div class="card"><h2>Devices</h2>'+list(d.devices||[],r=>esc(r.k),r=>r.n)+'</div>'
   +'<div class="card full"><h2>Recent visits</h2><div id="rv"></div></div></div>';
  const rv=$('#rv'), recent=d.recent||[];
  const draw=()=>{ rv.innerHTML=recent.length?recent.slice(0,ST.shown).map(v=>{ const pl=[v.city,v.region].filter(Boolean).join(', '); const ch=(byV[v.id]||[]).map(x=>'<span class="chip">'+esc(x.space)+' <em>'+dur(x.dur)+'</em></span>').join('<span style="color:var(--mut)">→</span>');
      return '<div class="vis"><div class="vh"><span class="when">'+when(v.started)+'</span><span class="pl">'+flag(v.country)+' '+esc(pl?pl+' · ':'')+esc(cname(v.country))+'</span><span class="m">'+esc(v.device)+' · '+esc(v.os)+' · '+esc(v.browser)+'</span><span class="m">from '+esc(v.ref||'Direct')+'</span>'+(ST.host?'':'<span class="m">'+esc(v.host||'')+'</span>')+(v.back?'<span class="tag back">came back</span>':'<span class="tag">new</span>')+(v.uname?'<span class="tag u">'+esc(v.uname)+(v.urole&&v.urole!=='none'?' · '+esc(v.urole):'')+'</span>':'')+'<span class="t">'+dur(v.dur)+'</span></div>'+(ch?'<div class="chips">'+ch+'</div>':'')+'</div>'; }).join('')+(recent.length>ST.shown?'<button class="btn more" id="mo">Show more</button>':''):'<p class="empty">No visits in this period yet.</p>';
    const mo=$('#mo'); if(mo) mo.onclick=()=>{ ST.shown+=40; draw(); }; };
  draw();
  document.querySelectorAll('#rg button').forEach(b=>b.onclick=()=>{ ST.days=+b.dataset.v; keep(); load(); });
  document.querySelectorAll('#hs button').forEach(b=>b.onclick=()=>{ ST.host=b.dataset.v; keep(); load(); });
  $('#rf').onclick=load;
  const me=$('#me'); try{ me.checked=localStorage.getItem('ps-vis-me')==='1'; }catch(_){} me.onchange=()=>{ try{ localStorage.setItem('ps-vis-me',me.checked?'1':'0'); }catch(_){} };
}
async function load(){
  if(!tok()) return signedOut();
  const j=await call({a:'board',days:ST.days,host:ST.host,tz:-new Date().getTimezoneOffset()});
  if(j._s===401) return signedOut();
  if(j._s===403) return claim();
  if(j._s!==200){ app.innerHTML='<div class="box"><h2>📊 Visitors</h2><p>The visitor log is not available right now'+(j.error==='nodb'?' (the database is not connected yet)':'')+'. Try again in a minute.</p><button class="btn pri" onclick="location.reload()">Try again</button></div>'; return; }
  board(j);
}
load();
})();
</script>
</body>
</html>
